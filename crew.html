<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crew Management — Memories Photography</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="assets/fav.png" />

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />

<script>
  tailwind.config = {
    theme: { extend: { maxWidth: { 'container': '1440px' } } }
  }
</script>
<style>
  body { background-color: #fafafa; }
  body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('assets/logo.png') center center no-repeat;
    background-size: 40%; opacity: 0.06; mix-blend-mode: multiply; z-index: -1; pointer-events: none;
  }
</style>
</head>
<body class="min-h-screen">

<div class="flex min-h-screen w-full relative z-0">

  <!-- Desktop Sidebar -->
  <aside class="hidden lg:flex lg:flex-col w-56 shrink-0 border-r border-gray-200 bg-white/80 backdrop-blur h-screen sticky top-0">
    <div class="flex items-center gap-2 px-5 h-14 border-b border-gray-200 shrink-0">
      <img src="assets/fav.png" alt="Memories Photography" class="h-6 w-auto" onerror="this.style.display='none'"/>
      <span class="font-display text-base font-semibold tracking-tight">Memories</span>
    </div>
    <nav id="desktop-nav" class="flex-1 overflow-y-auto px-3 py-3 space-y-0.5"></nav>
    <div class="px-4 py-3 border-t border-gray-200 flex items-center justify-between shrink-0 bg-white/90">
      <div class="flex items-center gap-2 min-w-0">
        <img src="assets/fav.png" class="h-8 w-8 rounded-full border border-gray-200 object-cover shrink-0" onerror="this.src='https://ui-avatars.com/api/?name=Studio+Owner&background=0D8ABC&color=fff'"/>
        <div class="min-w-0">
          <p class="text-xs font-medium truncate">Studio Owner</p>
          <p class="text-[11px] text-gray-500 truncate">Coimbatore</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 min-w-0 flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-gray-200 h-14 flex items-center px-4 sm:px-6 gap-4">
      <button id="mobile-menu-btn" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-gray-100">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="font-display text-base sm:text-lg font-semibold truncate flex-1">Crew Management</h1>
      <button class="btn-logout p-2 rounded-lg hover:bg-red-50 hover:text-red-600 transition-colors text-gray-500" title="Log Out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </header>

    <!-- Page Content -->
    <main class="flex-1 w-full max-w-container mx-auto px-4 sm:px-6 py-5 pb-24 lg:pb-6 space-y-4">
      
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h2 class="font-display text-xl sm:text-2xl font-semibold">Studio Team</h2>
          <p class="text-xs text-gray-500 mt-0.5">Manage photographers, videographers, and editors</p>
        </div>
        <button id="btn-open-crew-form" class="btn btn-primary self-start sm:self-auto shadow-md">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Add Crew Member</span>
        </button>
      </div>

      <!-- Crew Table -->
      <div class="panel bg-white/95 backdrop-blur shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[600px]">
            <thead>
              <tr class="border-b border-gray-200 bg-gray-50/50 text-[11px] font-semibold tracking-wider text-gray-500 uppercase">
                <th class="py-3 px-4">Name & Contact</th>
                <th class="py-3 px-4">Role</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="crew-list-tbody" class="divide-y divide-gray-100 text-sm">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
        <div id="crew-empty-state" class="hidden p-8 text-center text-xs text-gray-500">
          No crew members found. Click "Add Crew Member" to start building your team.
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Mobile Nav -->
<nav class="bottom-nav lg:hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 flex justify-around py-2 z-30">
  <a href="dashboard.html" class="flex flex-col items-center gap-1 px-3 py-1 text-gray-400 hover:text-black"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/></svg><span class="text-[10px] font-medium">Home</span></a>
  <a href="events.html" class="flex flex-col items-center gap-1 px-3 py-1 text-gray-400 hover:text-black"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg><span class="text-[10px] font-medium">Events</span></a>
  <a href="clients.html" class="flex flex-col items-center gap-1 px-3 py-1 text-gray-400 hover:text-black"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span class="text-[10px] font-medium">Clients</span></a>
</nav>

<!-- Mobile Drawer -->
<div id="mobile-drawer" class="fixed inset-0 z-40 hidden">
  <div id="mobile-overlay" class="absolute inset-0 bg-black/40"></div>
  <div class="absolute left-0 top-0 h-full w-64 max-w-[80%] bg-white p-4 flex flex-col shadow-xl">
    <div class="flex items-center justify-between mb-4 shrink-0">
      <div class="flex items-center gap-2">
        <img src="assets/fav.png" alt="Memories Photography" class="h-6 w-auto" onerror="this.style.display='none'"/>
        <span class="font-display font-semibold">Memories</span>
      </div>
      <button id="mobile-close-btn" class="p-2 rounded-lg hover:bg-gray-100"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <nav id="mobile-nav" class="space-y-0.5 overflow-y-auto flex-1"></nav>
    <div class="pt-4 border-t border-gray-200 shrink-0">
      <button class="btn-logout flex items-center gap-2 text-red-600 hover:bg-red-50 w-full p-2 rounded-lg text-sm font-medium transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Log Out
      </button>
    </div>
  </div>
</div>

<!-- ================= MODAL: ADD / EDIT CREW ================= -->
<div id="modal-crew-form" class="fixed inset-0 z-50 hidden">
  <div class="modal-backdrop absolute inset-0 bg-black/50 backdrop-blur-xs id-close-crew-form"></div>
  <div class="relative w-full h-full flex items-center justify-center p-4">
    <div class="panel bg-white w-full max-w-md p-5 shadow-2xl rounded-xl z-10 flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h3 id="crew-modal-title" class="font-display text-lg font-semibold text-gray-900">Add Crew Member</h3>
        <button class="p-2 -mr-2 rounded-lg hover:bg-gray-100 text-gray-500 id-close-crew-form">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="crew-form" class="space-y-4 text-xs">
        <input type="hidden" id="form-crew-id" />
        
        <div>
          <label class="block font-medium mb-1 text-gray-700">Full Name *</label>
          <input type="text" id="form-crew-name" class="input-control w-full font-medium" required />
        </div>

        <div>
          <label class="block font-medium mb-1 text-gray-700">Primary Role *</label>
          <select id="form-crew-role" class="input-control select-control w-full" required>
            <option value="Photographer">Photographer</option>
            <option value="Videographer">Videographer</option>
            <option value="Candid Specialist">Candid Specialist</option>
            <option value="Cinematographer">Cinematographer</option>
            <option value="Drone Operator">Drone Operator</option>
            <option value="Editor">Editor</option>
            <option value="Assistant">Assistant</option>
          </select>
        </div>

        <div>
          <label class="block font-medium mb-1 text-gray-700">Phone Number *</label>
          <input type="tel" id="form-crew-phone" class="input-control w-full" required />
        </div>

        <div>
          <label class="block font-medium mb-1 text-gray-700">Status</label>
          <select id="form-crew-status" class="input-control select-control w-full bg-gray-50 font-semibold">
            <option value="Active">Active (Available)</option>
            <option value="Inactive">Inactive (Unavailable)</option>
          </select>
        </div>

        <div class="pt-2 flex justify-end gap-2 border-t border-gray-100 mt-4">
          <button type="button" class="btn btn-secondary id-close-crew-form px-4">Cancel</button>
          <button type="submit" class="btn btn-primary px-5 shadow-md" id="btn-save-crew">Save Crew</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ================= TOAST NOTIFICATION ================= -->
<div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-16 opacity-0 transition-all duration-200 bg-black text-white text-xs py-2.5 px-4 rounded-lg shadow-lg flex items-center gap-2 pointer-events-none">
  <span id="toast-message">Action successful</span>
</div>

<script type="module" src="js/crew.js"></script>
</body>
</html>
