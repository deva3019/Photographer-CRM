<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio Login — Memories Photography</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />

<style>
  /* Custom fade blend for the dark side */
  .bg-dark-brand {
    background-color: #0a0a0a;
    background-image: url('assets/logo.jpg');
    background-size: cover;
    background-position: center;
    background-blend-mode: overlay;
  }
</style>
</head>
<body class="min-h-screen flex text-sm">

  <!-- Left Side: Brand Imagery (Hidden on small screens) -->
  <div class="hidden lg:flex lg:w-1/2 bg-dark-brand relative flex-col justify-between p-12 text-white">
    <div class="absolute inset-0 bg-black/70"></div> <!-- Fade overlay -->
    <div class="relative z-10">
      <h1 class="font-display text-4xl font-bold tracking-tight">Memories Photography</h1>
      <p class="text-gray-400 mt-2 text-lg">Coimbatore | Nagercoil</p>
    </div>
    <div class="relative z-10">
      <p class="text-gray-400">Studio Management System v2.0</p>
    </div>
  </div>

  <!-- Right Side: Login Panel -->
  <div class="w-full lg:w-1/2 bg-white flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-sm">
      
      <div class="text-center mb-8">
        <img src="assets/insta profile.jpg (1).jpg" alt="Memories Photography" class="h-20 w-20 rounded-full mx-auto mb-4 border border-gray-200 shadow-sm" onerror="this.style.display='none'"/>
        <h2 class="font-display text-2xl font-bold text-gray-900">Welcome Back</h2>
        <p class="text-gray-500 mt-1">Sign in to access your studio dashboard</p>
      </div>

      <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-lg border border-red-100 text-center"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block font-medium mb-1 text-gray-700">Email Address</label>
          <input type="email" id="email" class="input-control w-full py-2.5" placeholder="studio@example.com" required />
        </div>
        <div>
          <label class="block font-medium mb-1 text-gray-700">Password</label>
          <input type="password" id="password" class="input-control w-full py-2.5" placeholder="••••••••" required />
        </div>
        
        <button type="submit" id="btn-login" class="btn w-full btn-primary py-2.5 justify-center mt-2">
          <span id="login-text">Sign In securely</span>
          <span id="login-spinner" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full ml-2"></span>
        </button>
      </form>

      <div class="mt-6 flex items-center justify-center gap-3">
        <div class="h-px bg-gray-200 flex-1"></div>
        <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Or continue with</span>
        <div class="h-px bg-gray-200 flex-1"></div>
      </div>

      <button id="btn-google" class="btn w-full btn-secondary py-2.5 justify-center mt-6 flex items-center gap-2">
        <svg class="h-4 w-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        <span>Google Sign-In</span>
      </button>

    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
